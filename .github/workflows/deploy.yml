name: Deploy to GitHub Pages

# Requires: repository Settings > Pages > Source set to "GitHub Actions".
# Not "Deploy from a branch". Step 01 of docs/implementation-plan.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The action runs the package's `build` script: `astro build && node scripts/check-fill.mjs`,
      # so a [FILL] anywhere in dist/ fails this job and nothing is deployed.
      - name: Install, build and upload
        uses: withastro/action@v6
        with:
          path: .
          node-version: 24
          package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
