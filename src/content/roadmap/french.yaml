# One file is one timeline on the home page's Roadmap. See README.md in this folder.
title: French
order: 1
groups:
  - title: Conjugation
    nodes:
      - title: Présent (regular verbs)
        due: 2026-11-18
        done: false
        about: Present tense of 1st-group verbs (-er) and 2nd-group verbs (-ir with -iss-).
      - title: Présent (essential irregulars)
        due: 2026-11-19
        done: false
        about: "The 16 most frequent irregular verbs: être, avoir, aller, faire, the modals (pouvoir, vouloir, devoir, savoir) and other everyday verbs."
      - title: Passé composé
        due: 2026-11-21
        done: false
        about: Past tense for completed actions, formed with avoir or être + past participle; includes irregular participles.
      - title: Imparfait
        due: 2026-11-22
        done: false
        about: Past tense for habits, descriptions and background; contrast with the passé composé.
      - title: Futur proche and futur simple
        due: 2026-11-24
        done: false
        about: The conversational future (aller + infinitive) and the formal written future.
      - title: Gérondif
        due: 2026-11-25
        done: false
        about: En + present participle, for simultaneous actions, manner and condition.
      - title: Fixed expressions with avoir
        due: 2026-11-26
        done: false
        about: Avoir faim, avoir besoin de, avoir raison etc., where Portuguese uses "estar" or "ter".
  - title: Block 1A — Negation, questions and determiners
    nodes:
      - title: Negation
        due: 2026-11-28
        done: false
        about: Ne…pas and its variants (plus, jamais, rien, personne, pas encore, ni…ni, que), placement in compound tenses, and the article changing to de.
      - title: Questions
        due: 2026-11-29
        done: false
        about: Three registers (intonation, est-ce que, inversion), the linking -t-, question words, and quel agreeing in gender and number.
      - title: Possessives
        due: 2026-12-01
        done: false
        about: Mon/ma/mes etc., agreeing with the thing owned, not the owner.
      - title: Demonstratives
        due: 2026-12-02
        done: false
        about: Ce, cet, cette, ces, with -ci and -là to mark distance.
      - title: Stressed pronouns
        due: 2026-12-03
        done: false
        about: Moi, toi, lui, eux…, used after prepositions, for emphasis, after c'est, in comparisons and on their own.
  - title: Block 1B — Pronouns, pronominal verbs, imperative and prepositions
    nodes:
      - title: Direct and indirect object pronouns
        due: 2026-12-05
        done: false
        about: Replace the direct object (le, la, les) and the indirect object with à (lui, leur), always before the verb; participle agreement with a preceding direct object.
      - title: Y and EN
        due: 2026-12-06
        done: false
        about: Y replaces a place or à + thing; en replaces de + thing, partitives and quantities; fixed order when several pronouns combine.
      - title: Pronominal verbs
        due: 2026-12-07
        done: false
        about: Se lever, se coucher etc., with a reflexive pronoun that changes with the person and a passé composé formed with être.
      - title: Imperative
        due: 2026-12-08
        done: false
        about: Three persons (tu, nous, vous), irregulars (être, avoir, savoir), and pronoun placement in affirmative and negative commands.
      - title: Prepositions of place
        due: 2026-12-09
        done: false
        about: À/en/au/aux with cities and countries, de/du/des for origin, and positions in space (dans, sur, chez, en face de…).
      - title: Prepositions of time
        due: 2026-12-10
        done: false
        about: À, en, dans, il y a, depuis, pendant, pour, jusqu'à, vers, and how their meanings differ.
