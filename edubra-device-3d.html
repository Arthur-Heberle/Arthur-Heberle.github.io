    --pin:#1f4f66;--pin-side:#173b4c;--pin-head:#2c6683;--hole:#c2a375;--hole-rim:#6b4f2e;
    --cap:#e8b93a;--cap-hi:#f5d677;--cap-lo:#d6a324;--cap-side:#a97d18;--cap-side-2:#c3931f;
    --knob:#2a2b2d;--knob-hi:#4a4c50;--knob-side:#151617;
    --tilt:20deg;--pin-h:7px;--cap-h:8px;--box-depth:64px}
  html,body{margin:0;background:var(--color-ground);color:var(--color-graphite);
    font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:1040px;margin:0 auto;padding:56px 24px 96px}
  h1{font-weight:500;font-size:28px;line-height:1.15;margin:0 0 40px}

  /* ---------- 3D stage ---------- */
  .stage{perspective:2000px;perspective-origin:50% 10%;position:relative;padding-bottom:calc(var(--box-depth)*.6)}
  .box{position:relative;transform-style:preserve-3d;transform-origin:50% 100%;transform:rotateX(var(--tilt))}
  .floor-shadow{position:absolute;left:4%;right:4%;bottom:-6px;height:40px;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,rgb(60 45 25 / .28),transparent 70%)}
  .lid{position:relative;transform-style:preserve-3d;background:var(--wood) var(--wood-tex) 0 0/512px 512px repeat;
    display:flex;align-items:center;justify-content:flex-start;gap:40px;padding:40px 40px 30px}
  .lid::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,rgb(255 250 240 / .18),transparent 55%,rgb(80 55 25 / .08))}
  .front{position:absolute;left:0;right:0;top:100%;height:var(--box-depth);transform-origin:50% 0;
    transform:rotateX(-90deg);background:var(--wood) var(--wood-tex) 0 0/512px 512px repeat}
  .front::after{content:"";position:absolute;inset:0;background:rgb(70 48 22 / .30)}

  /* ---------- Braille cells: the gap BETWEEN cells is what makes letters readable ---------- */
  .word{display:flex;gap:30px;transform-style:preserve-3d}
  .cell{display:flex;flex-direction:column;align-items:center;gap:16px;transform-style:preserve-3d}
  .dots{display:grid;grid-template-columns:repeat(2,28px);grid-template-rows:repeat(3,28px);
    grid-auto-flow:column;gap:12px 13px;transform-style:preserve-3d}
  .pos{position:relative;width:28px;height:28px;transform-style:preserve-3d}
  .hole{position:absolute;inset:0;border-radius:50%;background:var(--hole);
    box-shadow:inset 0 0 0 1.5px var(--hole-rim),inset 0 3px 4px rgb(70 48 22 / .45)}
  .pin{position:absolute;inset:3px;transform-style:preserve-3d;pointer-events:none}
  .pin>i{position:absolute;inset:0;border-radius:50%;opacity:0;
    transition:opacity var(--dur-feedback) var(--ease-out),transform var(--dur-feedback) var(--ease-out)}
  .pin .shade{inset:-2px -4px -6px -1px;background:radial-gradient(ellipse at 45% 60%,rgb(60 40 18 / .45),transparent 68%)}
  .pin .s1,.pin .s2{background:var(--pin-side)}
  .pin .head{background:radial-gradient(circle at 38% 32%,var(--pin-head),var(--pin) 62%)}
  .pos.up .pin>i{opacity:1}
  .pos.up .pin .s1{transform:translateZ(calc(var(--pin-h)*.35))}
  .pos.up .pin .s2{transform:translateZ(calc(var(--pin-h)*.7))}
  .pos.up .pin .head{transform:translateZ(var(--pin-h))}
  .pos:not(.up) .pin>i{transition:none}
  .label{font-size:19px;line-height:1;font-weight:500;color:#4b4842;position:relative}
  .label.on{color:var(--color-graphite);font-weight:600}
  .label.on::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-8px;height:3px;background:var(--pin)}

  /* ---------- right side: volume knob + cross of four buttons ---------- */
  .panel{margin-left:auto;display:flex;align-items:center;gap:30px;transform-style:preserve-3d}
  .cross{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:10px;
    place-items:center;transform-style:preserve-3d}
  #back{grid-area:1/2}#slower{grid-area:2/1}#faster{grid-area:2/3}#play{grid-area:3/2}
  .speed{grid-area:2/2;font:500 13px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em}

  .btn{position:relative;width:52px;height:52px;border:0;padding:0;background:none;cursor:pointer;
    border-radius:50%;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent}
  .btn .well{position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgb(90 62 28 / .30) 55%,transparent 72%)}
  .btn .sd{position:absolute;inset:0;border-radius:50%;background:var(--cap-side)}
  .btn .sd2{position:absolute;inset:0;border-radius:50%;background:var(--cap-side-2);transform:translateZ(calc(var(--cap-h)*.5))}
  .btn .cap{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 36% 30%,var(--cap-hi),var(--cap) 55%,var(--cap-lo));
    transform:translateZ(var(--cap-h));transition:transform var(--dur-feedback) var(--ease-out)}
  .btn .cap svg{width:24px;height:24px;fill:none;stroke:var(--color-graphite);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .btn .cap svg .f{fill:var(--color-graphite);stroke:var(--color-graphite)}
  .btn:active .cap,.btn.pressed .cap{transform:translateZ(2px)}
  .btn:disabled{cursor:default}.btn:disabled .cap svg{opacity:.35}
  .btn:focus-visible,.knob:focus-visible{outline:2px solid var(--color-graphite);outline-offset:6px}

  /* volume knob, like the potentiometer on the real box: click or arrow keys step off / low / high */
  .knobwrap{display:flex;flex-direction:column;align-items:center;gap:10px;transform-style:preserve-3d}
  .knob{position:relative;width:54px;height:54px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;transform-style:preserve-3d}
  .knob .well{position:absolute;inset:-7px;border-radius:50%;background:radial-gradient(circle,rgb(90 62 28 / .35) 55%,transparent 72%)}
  .knob .sd{position:absolute;inset:0;border-radius:50%;background:var(--knob-side)}
  .knob .sd2{position:absolute;inset:0;border-radius:50%;background:var(--knob-side);transform:translateZ(6px)}
  .knob .top{position:absolute;inset:0;border-radius:50%;transform:translateZ(12px) rotate(var(--angle,-135deg));
    background:repeating-conic-gradient(from 0deg,var(--knob) 0 6deg,#323336 6deg 12deg);
    transition:transform 180ms var(--ease-out)}
  .knob .top::before{content:"";position:absolute;inset:7px;border-radius:50%;
    background:radial-gradient(circle at 36% 30%,var(--knob-hi),var(--knob) 65%)}
  .knob .top::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:#f2efe8}
  .vol{font:500 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em}

  /* ---------- try your own word ---------- */
  .try{display:flex;align-items:baseline;gap:14px;margin-top:34px}
  .try label{font-size:15px;color:var(--color-graphite-2)}
  .try input{font:500 20px/1.2 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
    width:11ch;border:0;border-bottom:1.5px solid var(--color-graphite-2);background:transparent;color:var(--color-graphite);padding:4px 2px}
  .try input:focus{outline:none;border-bottom-color:var(--color-signal)}
  .try small{font-size:13px;color:var(--color-graphite-2)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (max-width:860px){
    .device{--tilt:14deg}
    .lid{flex-direction:column;gap:28px;padding:30px 18px 24px}
    .word{flex-wrap:wrap;justify-content:center;row-gap:24px;max-width:340px}
    .panel{margin:0}
    .try{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){.pin>i,.btn .cap,.knob .top{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>EduBra — Braille teaching device</h1>
  <section class="device" aria-label="EduBra device demo">
    <div class="stage">
      <div class="box">
        <div class="lid">
          <div class="word" id="word" role="img" aria-label=""></div>
          <div class="panel">
            <div class="knobwrap">
              <button class="knob" id="knob" aria-label="Volume: off">
                <span class="well"></span><span class="sd"></span><span class="sd2"></span><span class="top"></span>
              </button>
              <span class="vol" id="volText" aria-hidden="true">off</span>
            </div>
            <div class="cross">
              <button class="btn" id="back" aria-label="Back to the start of the word">
                <span class="well"></span><span class="sd"></span><span class="sd2"></span>
                <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6v12"/><path class="f" d="M17.5 6.8v10.4a.8.8 0 0 1-1.2.7l-7.9-5.2a.8.8 0 0 1 0-1.4l7.9-5.2a.8.8 0 0 1 1.2.7z"/></svg></span>
              </button>
              <button class="btn" id="slower" aria-label="Slower">
                <span class="well"></span><span class="sd"></span><span class="sd2"></span>
                <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></span>
              </button>
              <div class="speed" id="speed" aria-live="polite">1×</div>
              <button class="btn" id="faster" aria-label="Faster">
                <span class="well"></span><span class="sd"></span><span class="sd2"></span>
                <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></span>
              </button>
              <button class="btn" id="play" aria-label="Pause" aria-pressed="false">
                <span class="well"></span><span class="sd"></span><span class="sd2"></span>
                <span class="cap"><svg viewBox="0 0 24 24" aria-hidden="true" id="playIcon"></svg></span>
              </button>
            </div>
          </div>
        </div>
        <div class="front" aria-hidden="true"></div>
      </div>
      <div class="floor-shadow" aria-hidden="true"></div>
    </div>

    <div class="try">
      <label for="tryword">Try a word</label>
      <input id="tryword" maxlength="6" value="EDUBRA" autocomplete="off" spellcheck="false">
      <small>letters A–Z, up to 6</small>
    </div>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>

<script>
(() => {
  const MAP = {A:[1],B:[1,2],C:[1,4],D:[1,4,5],E:[1,5],F:[1,2,4],G:[1,2,4,5],H:[1,2,5],I:[2,4],J:[2,4,5],
    K:[1,3],L:[1,2,3],M:[1,3,4],N:[1,3,4,5],O:[1,3,5],P:[1,2,3,4],Q:[1,2,3,4,5],R:[1,2,3,5],S:[2,3,4],
    T:[2,3,4,5],U:[1,3,6],V:[1,2,3,6],W:[2,4,5,6],X:[1,3,4,6],Y:[1,3,4,5,6],Z:[1,3,5,6]};
  const SPEEDS = [0.5, 0.75, 1, 1.5, 2], BASE_MS = 900, END_PAUSE_MS = 1400;
  const VOLS = [{name:'off',v:0,deg:-135},{name:'low',v:.5,deg:0},{name:'high',v:1,deg:135}];

  const wordEl = document.getElementById('word'), live = document.getElementById('live');
  let cells = [], i = 0, speedIx = 2, playing = true, timer = null, visible = true, volIx = 0;

  function build(word) {
    wordEl.innerHTML = ''; i = 0;
    cells = [...word].map(ch => {
      const cell = document.createElement('div'); cell.className = 'cell';
      const dots = document.createElement('div'); dots.className = 'dots';
      const pos = [];
      for (let n = 1; n <= 6; n++) {
        const p = document.createElement('div'); p.className = 'pos'; p.dataset.n = n;
        p.innerHTML = '<span class="hole"></span><span class="pin"><i class="shade"></i><i class="s1"></i><i class="s2"></i><i class="head"></i></span>';
        dots.appendChild(p); pos.push(p);
      }
      const label = document.createElement('div'); label.className = 'label'; label.textContent = ch;
      cell.append(dots, label); wordEl.appendChild(cell);
      return { ch, pos, label };
    });
    wordEl.setAttribute('aria-label', `The word ${word} in Braille, shown one letter at a time`);
    show(0); schedule();
  }

  function speak(ch) {
    if (!VOLS[volIx].v || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ch.toLowerCase());
    u.lang = 'en-US'; u.volume = VOLS[volIx].v; u.rate = Math.min(1.6, 0.9 * SPEEDS[speedIx]);
    speechSynthesis.speak(u);
  }
  function show(k, announce) {
    cells.forEach((c, j) => {
      const on = j === k, dots = on ? MAP[c.ch] : [];
      c.pos.forEach(p => p.classList.toggle('up', dots.includes(+p.dataset.n)));
      c.label.classList.toggle('on', on);
    });
    if (cells[k]) speak(cells[k].ch);
    if (announce && cells[k]) live.textContent = `Letter ${cells[k].ch}: dots ${MAP[cells[k].ch].join(', ')}`;
  }
  function schedule() {
    clearTimeout(timer);
    if (!playing || !visible || !cells.length) return;
    const last = i === cells.length - 1;
    timer = setTimeout(() => { i = last ? 0 : i + 1; show(i); schedule(); }, (last ? END_PAUSE_MS : BASE_MS) / SPEEDS[speedIx]);
  }

  const playBtn = document.getElementById('play'), playIcon = document.getElementById('playIcon');
  const ICON_PAUSE = '<path class="f" d="M7.6 6h2.8v12H7.6zM13.6 6h2.8v12h-2.8z" stroke-width="1.4"/>';
  const ICON_PLAY = '<path class="f" d="M8.5 6.6v10.8a.8.8 0 0 0 1.2.7l8.4-5.4a.8.8 0 0 0 0-1.4L9.7 5.9a.8.8 0 0 0-1.2.7z"/>';
  const renderPlay = () => { playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); playBtn.setAttribute('aria-pressed', String(!playing)); };
  const speedEl = document.getElementById('speed'), slower = document.getElementById('slower'), faster = document.getElementById('faster');
  const renderSpeed = () => { speedEl.textContent = `${SPEEDS[speedIx]}×`; slower.disabled = speedIx === 0; faster.disabled = speedIx === SPEEDS.length - 1; };

  playBtn.addEventListener('click', () => { playing = !playing; renderPlay(); if (!playing) speechSynthesis?.cancel(); show(i, !playing); schedule(); });
  document.getElementById('back').addEventListener('click', () => { i = 0; show(i, true); schedule(); });
  slower.addEventListener('click', () => { speedIx = Math.max(0, speedIx - 1); renderSpeed(); schedule(); });
  faster.addEventListener('click', () => { speedIx = Math.min(SPEEDS.length - 1, speedIx + 1); renderSpeed(); schedule(); });

  const knob = document.getElementById('knob'), volText = document.getElementById('volText');
  function setVol(ix) {
    volIx = (ix + VOLS.length) % VOLS.length;
    knob.style.setProperty('--angle', `${VOLS[volIx].deg}deg`);
    knob.querySelector('.top').style.setProperty('--angle', `${VOLS[volIx].deg}deg`);
    knob.setAttribute('aria-label', `Volume: ${VOLS[volIx].name}`); volText.textContent = VOLS[volIx].name;
    if (!VOLS[volIx].v && 'speechSynthesis' in window) speechSynthesis.cancel();
  }
  knob.addEventListener('click', () => setVol(volIx + 1));
  knob.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setVol(Math.min(2, volIx + 1)); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setVol(Math.max(0, volIx - 1)); }
  });

  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') b.classList.add('pressed'); });
    b.addEventListener('keyup', () => b.classList.remove('pressed'));
    b.addEventListener('blur', () => b.classList.remove('pressed'));
  });

  const input = document.getElementById('tryword');
  input.addEventListener('input', () => {
    const clean = input.value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 6);
    if (input.value !== clean) input.value = clean;
    build(clean || 'EDUBRA');
  });

  new IntersectionObserver(([e]) => { visible = e.isIntersecting; schedule(); }, { threshold: 0.3 })
    .observe(document.querySelector('.device'));

  renderPlay(); renderSpeed(); setVol(0); build('EDUBRA');
})();
</script>
</body>
</html>
